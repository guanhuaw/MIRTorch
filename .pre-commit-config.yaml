repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # Updated to latest
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.10.0  # Stable version, compatible with Python 3.10-3.13
    hooks:
      - id: black
        language_version: python3.10  # FIXED: Moved to correct indentation
        exclude: ^(?:tests|docs|examples)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4  # Updated to latest
    hooks:
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: [--fix]
        exclude: ^(?:tests|docs|examples)/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0  # Updated to latest
    hooks:
      - id: codespell
        exclude: ^(?:tests|docs|examples|mirtorch/vendors)/
        # Add ignore list for variable names that look like typos
        args: [--ignore-words-list=dout]
