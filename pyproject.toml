[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "MIRTorch"
dynamic = ["version"]
authors = [{ name = "Guanhua Wang", email = "guanhuaw@umich.edu" }]
description = "a PyTorch-based image reconstruction toolbox"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["signal processing", "inverse problems"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=1.13",
    "torchvision",
    "torchkbnufft>=1.4.0,<1.5.2",
    "finufft>=2.5,<3; platform_system != 'Darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "numpy>=1.24",
    "scipy",
    "PyWavelets",
]

[project.optional-dependencies]
examples = [
    "einops",
    "matplotlib",
]
cufinufft = [
    "cufinufft>=2.5,<3; platform_system == 'Linux' or platform_system == 'Windows'",
]
finufft = [
    "finufft>=2.5,<3",
]
docs = [
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2,<4",
    "myst-parser>=2,<5",
]
test = [
    "coverage",
    "pytest",
]
dev = [
    "jupyterlab",
    "ipywidgets",
    "h5py",
    "gdown",
    "wget",
    "scikit-image",
    "scikit-learn",
    "einops",
    "matplotlib",
    "coverage",
    "pytest",
    "check-manifest",
    "pyright",
    "ruff",
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2,<4",
    "myst-parser>=2,<5",
]

[project.urls]
Documentation = "https://mirtorch.readthedocs.io/"
Issues = "https://github.com/guanhuaw/MIRTorch/issues"
Repository = "https://github.com/guanhuaw/MIRTorch"

[tool.ruff]
target-version = "py310"
exclude = [
    "__pycache__",
    ".github",
    ".idea",
    ".vscode",
    "build",
    "dist",
    "docs",
    "mirtorch/vendors/pytorch_wavelets",
    "venv",
    ".git",
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["mirtorch*"]

[tool.setuptools.package-data]
"mirtorch.vendors.pytorch_wavelets.dtcwt.data" = ["*.npz"]

[tool.pyright]
include = [
    "mirtorch/alg",
    "mirtorch/linear/_finufft.py",
    "mirtorch/linear/linearmaps.py",
    "mirtorch/prox/prox.py",
]
exclude = [
    "__pycache__",
    ".github",
    ".idea",
    ".vscode",
    "build",
    "dist",
    "docs",
    "examples",
    "tests",
    "mirtorch/vendors/pytorch_wavelets",
    "venv",
    ".git",
]

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
build_command = "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MIRTORCH=$NEW_VERSION python -m build"

[tool.pytest.ini_options]
python_files = "*_tests.py"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mirtorch"]

[tool.coverage.report]
fail_under = 70
omit = ["mirtorch/vendors/*"]
