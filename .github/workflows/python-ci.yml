name: Python-CI

on:
  pull_request:
    branches:
      - master
      - develop
      - feature/*
  workflow_dispatch:

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,finufft]" pyright ruff

      - name: Lint with Ruff
        run: |
          ruff check mirtorch tests examples
          ruff format --check mirtorch tests examples

      - name: Type-check core APIs
        run: pyright

      - name: Test with pytest
        run: |
          python -m coverage run -m pytest
          python -m coverage report
