name: Python-CI

on:
  pull_request:
    branches:
      - master
      - develop
      - feature/*
  workflow_dispatch:
    inputs:
      accelerator:
        description: Optional self-hosted accelerator acceptance
        type: choice
        default: none
        options:
          - none
          - cuda
          - mps

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            pytest_args: ""
          - os: ubuntu-latest
            python-version: "3.12"
            pytest_args: ""
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            pytest_args: ""
          - os: macos-15
            python-version: "3.12"
            # Standard hosted macOS VMs expose MPS without usable GPU memory.
            pytest_args: '-k "not mps"'

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyright ruff

      - name: Lint with Ruff
        run: |
          ruff check mirtorch tests examples
          ruff format --check mirtorch tests examples

      - name: Type-check core APIs
        run: pyright

      - name: Test with pytest
        run: |
          python -m coverage run -m pytest ${{ matrix.pytest_args }}
          python -m coverage report

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  package:
    name: Installed wheel and CPU notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and exercise wheel in isolated mode
        run: |
          python -m pip install dist/*.whl
          python -I - <<'PY'
          from pathlib import Path

          import torch
          import mirtorch
          from mirtorch.linear import Diff1d
          from mirtorch.vendors.pytorch_wavelets import DTCWTForward, DTCWTInverse

          package_path = Path(mirtorch.__file__).resolve()
          assert "site-packages" in package_path.parts, package_path

          signal = torch.randn(2, 8)
          difference = Diff1d(signal.shape, dim=1, mode="periodic")
          assert difference.H(difference(signal)).shape == signal.shape

          image = torch.randn(1, 1, 16, 16)
          coefficients = DTCWTForward(J=2)(image)
          reconstructed = DTCWTInverse()(coefficients)
          torch.testing.assert_close(reconstructed, image, rtol=2e-5, atol=2e-5)
          print(mirtorch.__version__, package_path)
          PY

      - name: Install notebook dependencies from the wheel
        run: |
          for wheel in dist/*.whl; do
            python -m pip install "${wheel}[examples]"
          done
          python -m ipykernel install --sys-prefix --name mirtorch-ci

      - name: Execute self-contained notebooks with the installed package
        env:
          MIRTORCH_EXAMPLE_DEVICE: cpu
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          mkdir -p "$RUNNER_TEMP/mirtorch-notebooks"
          cp examples/demo_mr_physics.ipynb examples/demo_trajectory_optimization.ipynb examples/demo_ct.ipynb "$RUNNER_TEMP/mirtorch-notebooks/"
          cd "$RUNNER_TEMP/mirtorch-notebooks"
          python -m nbconvert --execute --to notebook --inplace \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=mirtorch-ci *.ipynb

      - name: Save executed CPU notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-cpu
          path: ${{ runner.temp }}/mirtorch-notebooks/*.ipynb
          if-no-files-found: ignore

  accelerator:
    name: Optional ${{ inputs.accelerator }} acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.accelerator != 'none'
    runs-on: [self-hosted, "${{ inputs.accelerator }}"]
    timeout-minutes: 45
    env:
      MIRTORCH_EXAMPLE_DEVICE: ${{ inputs.accelerator }}
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create an isolated acceptance environment
        run: |
          python -m venv "$RUNNER_TEMP/mirtorch-acceptance"
          echo "$RUNNER_TEMP/mirtorch-acceptance/bin" >> "$GITHUB_PATH"

      - name: Install the package and optional accelerator backend
        run: |
          python -m pip install --upgrade pip
          if [ "$MIRTORCH_EXAMPLE_DEVICE" = cuda ]; then
            python -m pip install ".[test,examples,cufinufft]"
          else
            python -m pip install ".[test,examples]"
          fi
          python -m ipykernel install --sys-prefix --name mirtorch-ci

      - name: Require a working accelerator and native CUDA NUFFT
        run: |
          python -I - <<'PY'
          import os
          from pathlib import Path

          import mirtorch
          import torch
          from mirtorch.linear import NuSense

          assert "site-packages" in Path(mirtorch.__file__).resolve().parts
          device = os.environ["MIRTORCH_EXAMPLE_DEVICE"]
          if device == "cuda":
              import cufinufft
              assert torch.cuda.is_available(), "CUDA is not available"
              backend = "finufft"
          else:
              assert torch.backends.mps.is_available(), "MPS is not available"
              backend = "torchkbnufft"
          image = torch.ones(1, 1, 8, 8, dtype=torch.complex64, device=device, requires_grad=True)
          trajectory = torch.linspace(-2, 2, 24, device=device).reshape(1, 2, 12).requires_grad_()
          operator = NuSense(torch.ones_like(image), trajectory, backend=backend)
          samples = operator(image)
          assert samples.device.type == device
          gradients = torch.autograd.grad(samples.abs().square().sum(), (image, trajectory))
          assert all(torch.isfinite(gradient).all().item() for gradient in gradients)
          print(torch.__version__, device, operator.backend)
          PY

      - name: Run numerical and gradient tests
        run: python -m pytest

      - name: Execute reconstruction notebooks on the selected accelerator
        run: |
          mkdir -p "$RUNNER_TEMP/mirtorch-notebooks"
          cp examples/demo_mr_physics.ipynb examples/demo_trajectory_optimization.ipynb examples/demo_3d.ipynb examples/demo_ct.ipynb examples/demo_mlem.ipynb "$RUNNER_TEMP/mirtorch-notebooks/"
          cd "$RUNNER_TEMP/mirtorch-notebooks"
          python -m nbconvert --execute --to notebook --inplace \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=mirtorch-ci *.ipynb

      - name: Save executed accelerator notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-${{ inputs.accelerator }}
          path: ${{ runner.temp }}/mirtorch-notebooks/*.ipynb
          if-no-files-found: ignore
